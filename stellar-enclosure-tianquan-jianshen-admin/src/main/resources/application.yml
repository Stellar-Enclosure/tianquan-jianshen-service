spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: tianquan-jianshen-admin
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  datasource:
    url: ${TIANQUAN_JIANSHEN_POSTGRES_URL}
    username: ${TIANQUAN_JIANSHEN_POSTGRES_USER}
    password: ${TIANQUAN_JIANSHEN_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${TIANQUAN_JIANSHEN_ADVERTISED_PORT:0}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${TIANQUAN_JIANSHEN_OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  group-configs:
    - group: iam
      paths-to-match:
        - /api/tianquan-jianshen/v1/**
        - /api/v1/auth/about
      paths-to-exclude:
        - /api/tianquan-jianshen/v1/registration/**
        - /api/tianquan-jianshen/v1/internal/business-participations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,rbac3Readiness,tianquanAuditReadiness

egon.cola.platform:
  tianquan:
    shoubing:
      usage-observation:
        receiver: JIANSHEN
        enabled: true
        fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
        allow-local-plaintext: false
      trusted-issuers:
        tenant-a:
          issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_TENANT_A_JWKS_URI}
          realm-key: ${TIANQUAN_SHOUBING_TENANT_A_REALM_KEY}
          realm-type: TENANT
          tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_TENANT_A_TRUST_VERSION}
        tenant-b:
          issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_TENANT_B_JWKS_URI}
          realm-key: ${TIANQUAN_SHOUBING_TENANT_B_REALM_KEY}
          realm-type: TENANT
          tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_TENANT_B_TRUST_VERSION}
        platform:
          issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
          jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWKS_URI}
          realm-key: platform
          realm-type: PLATFORM
          status: ACTIVE
          trust-version: ${TIANQUAN_SHOUBING_PLATFORM_TRUST_VERSION}
      authority:
        base-uri: ${TIANQUAN_SHOUBING_AUTHORITY_BASE_URI}
        timeout: PT2S
        bindings:
          tenant-a:
            issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
            registration-id: ${TIANQUAN_JIANSHEN_IDENTITY_TENANT_A_REGISTRATION_ID}
            source-resource: ${TIANQUAN_JIANSHEN_RESOURCE_URI}
            audience: ${TIANQUAN_SHOUBING_IDENTITY_RESOURCE_URI}
            context: TENANT
            tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
            scopes:
              - tianquan-shoubing:security-state:resolve
              - tianquan-shoubing:audit:append
          tenant-b:
            issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
            registration-id: ${TIANQUAN_JIANSHEN_IDENTITY_TENANT_B_REGISTRATION_ID}
            source-resource: ${TIANQUAN_JIANSHEN_RESOURCE_URI}
            audience: ${TIANQUAN_SHOUBING_IDENTITY_RESOURCE_URI}
            context: TENANT
            tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
            scopes:
              - tianquan-shoubing:security-state:resolve
              - tianquan-shoubing:audit:append
          platform:
            issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
            registration-id: ${TIANQUAN_JIANSHEN_IDENTITY_PLATFORM_REGISTRATION_ID}
            source-resource: ${TIANQUAN_JIANSHEN_RESOURCE_URI}
            audience: ${TIANQUAN_SHOUBING_IDENTITY_RESOURCE_URI}
            context: PLATFORM
            scopes:
              - tianquan-shoubing:security-state:resolve
              - tianquan-shoubing:audit:append
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
      jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
      service-client:
        app-id: ${TIANQUAN_JIANSHEN_SERVICE_APP_ID}
        registration-id: ${TIANQUAN_JIANSHEN_SERVICE_REGISTRATION_ID}
        # The authorized deployment projection supplies exact tenant-registration-ids.
      rpc:
        enabled: ${TIANQUAN_JIANSHEN_RPC_CONSUMER_ENABLED:true}
        consumer:
          enabled: ${TIANQUAN_JIANSHEN_RPC_CONSUMER_ENABLED:true}
          bindings:
            tenant-membership:
              service-name: egon.tianquan.shoubing.v1.IdentityDirectoryService
              group: tianquan-shoubing
              version: 1.0.0
              full-method-name: egon.tianquan.shoubing.v1.IdentityDirectoryService/GetTenantMembership
              process-identity:
                "[applicationName]": tianquan-jianshen-admin
                env: ${egon.cola.component.rpc.identity.env}
              mode: SERVICE
              app-id: ${TIANQUAN_JIANSHEN_SERVICE_APP_ID}
              resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI}
              scope-context: TENANT
              scopes: [identity:read]
              transport-binding-id: shoubing-identity-directory
              transport-binding-version: 1
            identity-profiles:
              service-name: egon.tianquan.shoubing.v1.IdentityDirectoryService
              group: tianquan-shoubing
              version: 1.0.0
              full-method-name: egon.tianquan.shoubing.v1.IdentityDirectoryService/BatchGetIdentityProfiles
              process-identity:
                "[applicationName]": tianquan-jianshen-admin
                env: ${egon.cola.component.rpc.identity.env}
              mode: SERVICE
              app-id: ${TIANQUAN_JIANSHEN_SERVICE_APP_ID}
              resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI}
              scope-context: TENANT
              scopes: [identity:read]
              transport-binding-id: shoubing-identity-directory
              transport-binding-version: 1
      resource-server-id: ${TIANQUAN_JIANSHEN_RESOURCE_SERVER_ID}
      resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI}
    jianshen:
      user-scope-policy:
        enabled: true
        permission-scopes:
          "[system:role-permission:read]": ["system:role-permission:read"]
          "[system:role-permission:manage]": ["system:role-permission:manage"]
          "[system:permission-catalog:read]": ["system:permission-catalog:read"]
          "[system:permission-catalog:manage]": ["system:permission-catalog:manage"]
          "[system:permission-catalog:activate]": ["system:permission-catalog:activate"]
          "[system:about:read]": ["system:about:read"]
          "[system:application:manage]": ["system:application:manage"]
          "[system:application:read]": ["system:application:read"]
          "[system:audit:read]": ["system:audit:read"]
          "[system:authorization-constraint:manage]": ["system:authorization-constraint:manage"]
          "[system:authorization-constraint:read]": ["system:authorization-constraint:read"]
          "[system:authorization-runtime:operate]": ["system:authorization-runtime:operate"]
          "[system:authorization-runtime:read]": ["system:authorization-runtime:read"]
          "[system:authorization-simulation:execute]": ["system:authorization-simulation:execute"]
          "[system:business:read]": ["system:business:read"]
          "[system:data-rule:manage]": ["system:data-rule:manage"]
          "[system:data-rule:read]": ["system:data-rule:read"]
          "[system:directory-snapshot:read]": ["system:directory-snapshot:read"]
          "[system:directory:read]": ["system:directory:read"]
          "[system:directory:sync]": ["system:directory:sync"]
          "[system:field-definition:manage]": ["system:field-definition:manage"]
          "[system:field-definition:read]": ["system:field-definition:read"]
          "[system:field-rule:manage]": ["system:field-rule:manage"]
          "[system:field-rule:read]": ["system:field-rule:read"]
          "[system:management-policy:manage]": ["system:management-policy:manage"]
          "[system:management-policy:read]": ["system:management-policy:read"]
          "[system:operation-sod:manage]": ["system:operation-sod:manage"]
          "[system:operation-sod:read]": ["system:operation-sod:read"]
          "[system:organization:manage]": ["system:organization:manage"]
          "[system:organization:read]": ["system:organization:read"]
          "[system:permission:manage]": ["system:permission:manage"]
          "[system:permission:read]": ["system:permission:read"]
          "[system:position:manage]": ["system:position:manage"]
          "[system:position:read]": ["system:position:read"]
          "[system:resource-permission:manage]": ["system:resource-permission:manage"]
          "[system:resource-permission:read]": ["system:resource-permission:read"]
          "[system:resource:archive]": ["system:resource:archive"]
          "[system:resource:read]": ["system:resource:read"]
          "[system:role-activation:read]": ["system:role-activation:read"]
          "[system:role-activation:use]": ["system:role-activation:use"]
          "[system:role-assignment:manage]": ["system:role-assignment:manage"]
          "[system:role-inheritance:manage]": ["system:role-inheritance:manage"]
          "[system:role-resource:manage]": ["system:role-resource:manage"]
          "[system:role-resource:read]": ["system:role-resource:read"]
          "[system:role:create]": ["system:role:create"]
          "[system:role:read]": ["system:role:read"]
          "[system:role:update]": ["system:role:update"]
          "[system:user-application-access:read]": ["system:user-application-access:read"]
          "[system:user-business-access:manage]": ["system:user-business-access:manage"]
          "[system:user-business-access:read]": ["system:user-business-access:read"]
          "[system:user-organization:manage]": ["system:user-organization:manage"]
          "[system:user-organization:read]": ["system:user-organization:read"]
          "[system:user-position:manage]": ["system:user-position:manage"]
          "[system:user-position:read]": ["system:user-position:read"]
          "[system:user-status:manage]": ["system:user-status:manage"]
          "[system:user:manage]": ["system:user:manage"]
          "[system:user:read]": ["system:user:read"]
      enabled: ${UNIFIED_IDENTITY_ENABLED:true}
      register-filter: false
      system-code: tianquan-jianshen
      runtime:
        artifact-digest: ${TIANQUAN_JIANSHEN_ARTIFACT_DIGEST:}
        bootstrap-service-resource-keys:
          - tianquan-jianshen.api.manifest.plan
          - tianquan-jianshen.api.manifest.register
          - tianquan-jianshen.api.manifest.status
          - tianquan-jianshen.api.catalog.qualify
          - tianquan-jianshen.api.catalog.activate
          - tianquan-jianshen.api.catalog.descriptor
          - tianquan-jianshen.api.catalog.versions
          - tianquan-jianshen.api.runtime.userSnapshot
          - tianquan-jianshen.api.runtime.servicePolicy
      authorization:
        endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT}
        service-token:
          enabled: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_ENABLED:true}
          resource-uri: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_RESOURCE_URI:}
          scopes: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_SCOPES:}
          renewal-skew: ${TIANQUAN_JIANSHEN_AUTHORIZATION_SERVICE_TOKEN_RENEWAL_SKEW:30s}

egon:
  tianquan-jianshen:
    logical-catalog:
      enabled: ${TIANQUAN_JIANSHEN_LOGICAL_CATALOG_ENABLED:true}
      origin: ${TIANQUAN_JIANSHEN_LOGICAL_CATALOG_ORIGIN:http://tianshu-admin-http.platform-prod.svc.cluster.local:18080}
      audience: ${TIANQUAN_JIANSHEN_LOGICAL_CATALOG_AUDIENCE:}
      timeout: ${TIANQUAN_JIANSHEN_LOGICAL_CATALOG_TIMEOUT:PT2S}
      command-tenant: ${TIANQUAN_JIANSHEN_LOGICAL_CATALOG_COMMAND_TENANT:}
    maximum-active-roots: 16
    component-keys: ${TIANQUAN_JIANSHEN_COMPONENT_KEYS}
  cola:
    component:
      cache:
        enabled: false
      id:
        enabled: true
      rpc:
        transport: h2c
        enabled: ${TIANQUAN_JIANSHEN_RPC_ENABLED:true}
        identity:
          env: ${DEPLOYMENT_ENV}
          host: ${TIANQUAN_JIANSHEN_ADVERTISED_HOST}
          instance-id: ${TIANQUAN_JIANSHEN_INSTANCE_ID}
        provider:
          enabled: false
        consumer:
          enabled: ${TIANQUAN_JIANSHEN_RPC_CONSUMER_ENABLED:true}
          default-timeout-ms: 1500
          bindings:
            shoubing-identity-directory:
              version: 1
              namespace: ${TIANQUAN_SHOUBING_RPC_SERVICE_NAMESPACE:permission-prod}
              service: ${TIANQUAN_SHOUBING_RPC_SERVICE_NAME:tianquan-shoubing-rpc}
              port: ${TIANQUAN_SHOUBING_RPC_SERVICE_PORT:18122}
              methods:
                - egon.tianquan.shoubing.v1.IdentityDirectoryService/GetTenantMembership
                - egon.tianquan.shoubing.v1.IdentityDirectoryService/BatchGetIdentityProfiles
          retry-approvals:
            "[egon.tianquan.shoubing.v1.IdentityDirectoryService/GetTenantMembership]":
              retries: 1
              attempt-timeout-ms: 600
              total-timeout-ms: 1500
      tianshu:
        enabled: false
        delivery:
          enabled: false
      yuheng:
        openapi:
          enabled: ${TIANQUAN_JIANSHEN_OPENAPI_ENABLED:false}
          published-groups:
            - iam
          biz-code: ${TIANQUAN_JIANSHEN_OPENAPI_BIZ_CODE:${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}}
          application-code: ${TIANQUAN_JIANSHEN_OPENAPI_APPLICATION_CODE:${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}}
          resource-uri: ${TIANQUAN_JIANSHEN_OPENAPI_RESOURCE_URI:${TIANQUAN_JIANSHEN_RESOURCE_URI:}}
          artifact-version: ${TIANQUAN_JIANSHEN_OPENAPI_ARTIFACT_VERSION:${TIANQUAN_JIANSHEN_ARTIFACT_VERSION:local}}
          build-id: ${TIANQUAN_JIANSHEN_OPENAPI_BUILD_ID:${TIANQUAN_JIANSHEN_BUILD_ID:local}}
        reporting:
          enabled: ${TIANQUAN_JIANSHEN_YUHENG_REPORTING_ENABLED:true}
          admin-base-url: ${YUHENG_ADMIN_BASE_URL}
          biz-code: ${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}
          application-code: ${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}
          application-name: Tianquan-Jianshen Permission Admin
          env: ${DEPLOYMENT_ENV}
          namespace: ${DEPLOYMENT_NAMESPACE}
          artifact-version: ${TIANQUAN_JIANSHEN_ARTIFACT_VERSION}
          build-id: ${TIANQUAN_JIANSHEN_BUILD_ID}
          declared-hosts: ${TIANQUAN_JIANSHEN_DECLARED_HOSTS}
          fail-fast: true
          access-key: ${YUHENG_REPORT_ACCESS_KEY}
          secret-key: ${YUHENG_REPORT_SECRET_KEY}
          state-file: ${YUHENG_REPORT_STATE_FILE}
      mybatis-plus:
        ddl:
          enabled: true
          lock-timeout: 30s
          statement-timeout: 300s
          topology-ready-timeout: 60s
        sharding:
          enabled: true
          mode: SHARDING
          config-style: NATIVE
          native-rules-resource: classpath:rbac-sharding-native.yml
          transaction-default-type: LOCAL
          data-sources:
            - name: rbac_primary
              logical-name: rbac_primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: ${spring.datasource.url}
              username: ${spring.datasource.username}
              password: ${spring.datasource.password}
          tables: {}
        tenant-id:
          ignored-tables:
            - egon_cola_outbox_message
      transactional-outbox:
        enabled: true
        node-id: ${TIANQUAN_JIANSHEN_INSTANCE_ID}
        storage:
          data-source-bean-name: dataSource
          transaction-manager-bean-name: transactionManager
          mp:
            sql-session-factory-bean-name: sqlSessionFactory
            migration-mode: false
            auto-initialize-ddl: true
            migration-lock-timeout: 30s
            manifest-resource: db/egon-outbox-mp/manifest.json
        polling:
          enabled: true
          fixed-delay: 1s
          batch-size: 100
          concurrency: 4

tianquan-jianshen:
  maximum-active-roots: ${egon.tianquan-jianshen.maximum-active-roots}

---
spring:
  config:
    activate:
      on-profile: "cloud-native & !rbac3-catalog-command & !rbac3-platform-bootstrap"
    import: "tianshu-baseline:/var/run/tianshu/config/baseline.json"
egon.cola.component.tianshu:
  enabled: true
  baseline:
    scope:
      tenant-id: ${TIANSHU_CONFIG_TENANT_ID}
      biz-code: ${TIANQUAN_JIANSHEN_RESOURCE_BIZ_CODE:permission}
      env: ${DEPLOYMENT_ENV}
      app-code: ${TIANQUAN_JIANSHEN_RESOURCE_APP_CODE:tianquan-jianshen}
      resource-name: application.yml
    target:
      binding-id: ${TIANSHU_CONFIG_BINDING_ID}
      binding-revision: ${TIANSHU_CONFIG_BINDING_REVISION}
      cluster-id: ${KUBERNETES_CLUSTER_ID}
      kubernetes-namespace: ${DEPLOYMENT_NAMESPACE}
      workload-uid: ${KUBERNETES_WORKLOAD_UID}
      container-name: ${KUBERNETES_CONTAINER_NAME}
  delivery:
    enabled: true
    identity-tenant-id: ${TIANSHU_CONFIG_IDENTITY_TENANT_ID}
    expected-issuer: ${TIANSHU_CONFIG_EXPECTED_ISSUER}
    canonical-audience: ${TIANSHU_CONFIG_CANONICAL_AUDIENCE}
    registration-id: ${TIANSHU_CONFIG_REGISTRATION_ID}
    app-id: ${TIANQUAN_JIANSHEN_SERVICE_APP_ID}
    pod-uid: ${KUBERNETES_POD_UID}
    state-directory: /var/run/tianshu/state
    service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
